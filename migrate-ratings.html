<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Migrasi Rating - JasKit</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

margin:0;

font-family:Arial,sans-serif;

background:#f4f7fb;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}

.card{

width:min(520px,92%);

background:#fff;

border-radius:22px;

padding:28px;

box-shadow:0 16px 40px rgba(15,23,42,.12);

}

h1{

margin:0 0 10px;

font-size:24px;

color:#0f172a;

}

p{

color:#64748b;

line-height:1.6;

}

button{

width:100%;

height:54px;

margin-top:24px;

border:none;

border-radius:14px;

background:#2563eb;

color:#fff;

font-size:16px;

font-weight:700;

cursor:pointer;

}

button:disabled{

opacity:.6;

cursor:not-allowed;

}

#log{

margin-top:20px;

padding:16px;

background:#f8fafc;

border-radius:14px;

white-space:pre-line;

font-size:14px;

line-height:1.7;

color:#334155;

}

</style>

</head>

<body>

<div class="card">

<h1>Migrasi Rating</h1>

<p>

Halaman ini digunakan <b>satu kali</b> untuk menambahkan
<b>serviceId</b> ke seluruh data rating lama.

</p>

<button id="startMigration">

Mulai Migrasi

</button>

<div id="log">

Siap menjalankan migrasi...

</div>

</div>

<script
type="module"
src="migrate-ratings.js">

</script>

</body>

</html>
