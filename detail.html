<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Jasa - JasKit</title>

<link rel="stylesheet" href="styles.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.detail-header{
background:linear-gradient(
135deg,
#1e3a8a,
#2563eb
);
color:white;
padding:20px;
display:flex;
align-items:center;
gap:15px;
}

.detail-header h1{
margin:0;

}

.detail-header p{
margin:4px 0 0;
font-size:13px;

}

.back-btn{
color:white;
text-decoration:none;
font-size:24px;
font-weight:bold;
}

.profile-card{
background:white;
margin:20px;
padding:30px 20px;
border-radius:24px;
box-shadow:
0 10px 30px rgba(0,0,0,.08);
text-align:center;
}

.profile-image{
width:120px;
height:120px;
border-radius:50%;
background:#e2e8f0;
margin:auto;
display:flex;
align-items:center;
justify-content:center;

}

.profile-card h2{
margin-top:15px;
color:#0f172a;
}

.rating{
color:#f59e0b;
margin-top:10px;
font-weight:bold;
}

.info-box{
background:white;
margin:15px 20px;
padding:20px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.info-box h3{
margin-bottom:10px;
color:#0f172a;
}

.action-buttons{
padding:10px 20px 20px;
}

.order-btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-weight:bold;
cursor:pointer;
background:#2563eb;
color:white;
font-size:16px;
}

.chat-btn{
background:#e2e8f0;
}

</style>

</head>
<body>

<div class="detail-header">

<a href="javascript:history.back()"
class="back-btn">
←
</a>

<div>

<h1>Detail Jasa</h1>

<p>
Informasi lengkap penyedia jasa
</p>

</div>

</div>

<div class="profile-card">

<div
id="coverContainer"
style="
width:100%;
height:220px;
border-radius:20px;
overflow:hidden;
background:#eef4ff;
margin-bottom:20px;
">

<img
id="coverImage"
src="logo-jaskit.png"
style="
width:100%;
height:100%;
object-fit:cover;
display:block;
">

</div>

<div
id="serviceTypeBadge"
style="
margin-bottom:15px;
">
</div>

<h2 id="namaJasa">
Loading...
</h2>

<div
id="ratingSummary"
style="
margin-top:10px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
font-size:15px;
font-weight:600;
color:#475569;
">

<span id="ratingText">

⭐ Baru

</span>

<span
id="distanceText"
style="
color:#64748b;
">

📍 -

</span>

</div>

<p
id="namaUsaha"
style="
margin-top:12px;
font-size:17px;
font-weight:600;
">

Memuat penyedia jasa...

</p>

<p
id="detailAlamat"
style="
margin-top:8px;
color:#64748b;
">

-

</p>

</div>

<div class="info-box">

<h3>
📍 Area Layanan
</h3>

<p
id="areaLayanan"
style="
margin-top:10px;
line-height:1.7;
color:#334155;
">

Loading...

</p>

<hr
style="
margin:18px 0;
border:none;
border-top:1px solid #e2e8f0;
">

<h3>
💰 Harga Mulai
</h3>

<p
id="harga"
style="
margin-top:12px;
font-size:26px;
font-weight:700;
color:#2563eb;
">

Loading...

</p>

<p
style="
margin-top:6px;
font-size:13px;
color:#64748b;
">

Harga dapat berubah sesuai tingkat kesulitan pekerjaan.

</p>

</div>

<div class="info-box">

<h3>
📝 Tentang Jasa
</h3>

<p
id="deskripsi"
style="
line-height:1.8;
color:#334155;
white-space:pre-line;
">

Loading...

</p>

</div>

<div class="info-box">

<h3>
📷 Foto Jasa
</h3>

<div
id="galleryContainer"
style="
display:flex;
gap:12px;
overflow-x:auto;
padding-top:10px;
">

<p
id="galleryEmpty"
style="
color:#64748b;
">

Belum ada foto.

</p>

</div>

</div>

<div
id="imagePreview"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.88);
z-index:9999;
justify-content:center;
align-items:center;
padding:20px;
">

<img
id="previewImage"
style="
max-width:100%;
max-height:100%;
border-radius:18px;
">

</div>

<div class="action-buttons">

<button
id="btnPesan"
class="order-btn">
Pesan Sekarang
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCnk56ZY63q2h1ewEdiivzB0rrSfJOJtYo",
authDomain: "jasaku-92b55.firebaseapp.com",
projectId: "jasaku-92b55",
storageBucket: "jasaku-92b55.firebasestorage.app",
messagingSenderId: "217601622524",
appId: "1:217601622524:web:e3bc48dbdc50d7cb10b279"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params =
new URLSearchParams(
window.location.search
);

const serviceId =
params.get("id");
  
let serviceOwnerId = null;

let userLatitude = null;

let userLongitude = null;

async function getUserLocation(){

return new Promise(resolve=>{

if(!navigator.geolocation){

resolve();

return;

}

navigator.geolocation.getCurrentPosition(

(position)=>{

userLatitude =
position.coords.latitude;

userLongitude =
position.coords.longitude;

resolve();

},

()=>{

resolve();

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:300000

}

);

});

}

function calculateDistance(

lat1,

lon1,

lat2,

lon2

){

const R = 6371;

const dLat =
(lat2-lat1) * Math.PI / 180;

const dLon =
(lon2-lon1) * Math.PI / 180;

const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(dLon/2)

*

Math.sin(dLon/2);

const c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);

return R * c;

}

async function loadDetail(){

await getUserLocation();

if(!serviceId){
  
document.getElementById(
"btnPesan"
).disabled = true;

document.getElementById(
"namaJasa"
).innerText =
"Jasa Tidak Ditemukan";

document.getElementById(
"harga"
).innerText =
"-";

document.getElementById(
"deskripsi"
).innerText =
"Data jasa tidak tersedia";
  
return;

}

const serviceRef =
doc(
db,
"services",
serviceId
);

const serviceSnap =
await getDoc(serviceRef);

if(serviceSnap.exists()){

const data =
serviceSnap.data();

const userRef =
doc(
db,
"users",
data.userId
);

const userSnap =
await getDoc(userRef);

if(userSnap.exists()){

const userData =
userSnap.data();

document.getElementById(
"namaUsaha"
).innerText =
"🏪 " +
(
userData.businessName ||
userData.name ||
"Penyedia Jasa"
);

}else{

document.getElementById(
"namaUsaha"
).innerText =
"🏪 Penyedia Jasa";

}
  
serviceOwnerId =
data.userId; 
  
document.getElementById(
"areaLayanan"
).innerText =
data.alamatOperasional || "-";

document.getElementById(
"namaJasa"
).innerText =
data.namaJasa;

document.getElementById(
"harga"
).innerText =
"Rp " + data.harga;

document.getElementById(
"deskripsi"
).innerText =
data.deskripsi;

const coverImage =
document.getElementById(
"coverImage"
);

if(
data.coverImage &&
data.coverImage.trim()!==""
){

coverImage.src =
data.coverImage;

}else{

coverImage.src =
"logo-jaskit.png";

}

const gallery =
document.getElementById(
"galleryContainer"
);

gallery.innerHTML = "";

const images = [];

if(data.coverImage){

images.push(data.coverImage);

}

if(
Array.isArray(data.photos)
){

images.push(
...data.photos
);

}

if(images.length===0){

gallery.innerHTML =

`<p
style="color:#64748b;">
Belum ada foto.
</p>`;

}else{

images.forEach(url=>{

const image =
document.createElement("img");

image.src = url;

image.style.width = "140px";

image.style.height = "100px";

image.style.objectFit = "cover";

image.style.borderRadius = "14px";

image.style.flex = "none";

image.style.cursor = "pointer";

image.addEventListener("click",()=>{

document.getElementById(
"previewImage"
).src = url;

document.getElementById(
"imagePreview"
).style.display = "flex";

});

gallery.appendChild(image);

});

document.getElementById(
"imagePreview"
).onclick = ()=>{

document.getElementById(
"imagePreview"
).style.display = "none";

};

}

document.getElementById(
"detailAlamat"
).innerText =

data.detailAlamat ||

data.alamatOperasional ||

"-";

if(

userLatitude !== null &&

userLongitude !== null &&

typeof data.latitude === "number" &&

typeof data.longitude === "number"

){

const distance =

calculateDistance(

userLatitude,

userLongitude,

data.latitude,

data.longitude

);

document.getElementById(

"distanceText"

).innerHTML =

`📍 ${distance.toFixed(1)} km`;

}

/* ===========================
   RATING JASA
=========================== */

const ratingBox =
document.getElementById(
"ratingSummary"
);

const ratingQuery =
query(
collection(db,"ratings"),
where(
"serviceId",
"==",
serviceId
)
);

const ratingSnapshot =
await getDocs(
ratingQuery
);

let totalRating = 0;

let totalReview = 0;

ratingSnapshot.forEach(doc=>{

const item = doc.data();

totalRating +=
Number(item.rating || 0);

totalReview++;

});

if(totalReview>0){

const average =
(
totalRating /
totalReview
).toFixed(1);

ratingBox.innerHTML =

`⭐ ${average} (${totalReview})`;

}else{

ratingBox.innerHTML =

`⭐ Baru`;

}

let badge = "";

if(data.serviceType==="express"){

badge = `
<span style="
background:#fef3c7;
color:#92400e;
padding:6px 12px;
border-radius:999px;
font-size:12px;
font-weight:bold;
">
⚡ EKSPRES
</span>
`;

}

else if(
data.serviceType==="scheduled"
){

badge = `
<span style="
background:#dbeafe;
color:#1e40af;
padding:6px 12px;
border-radius:999px;
font-size:12px;
font-weight:bold;
">
📅 TERJADWAL
</span>
`;

}

else if(
data.serviceType==="both"
){

badge = `
<span style="
background:#dcfce7;
color:#166534;
padding:6px 12px;
border-radius:999px;
font-size:12px;
font-weight:bold;
">
⚡📅 EKSPRES & TERJADWAL
</span>
`;

}

document.getElementById(
"serviceTypeBadge"
).innerHTML = badge;

}else{
  
document.getElementById(
"btnPesan"
).disabled = true;

document.getElementById(
"namaJasa"
).innerText =
"Jasa Tidak Ditemukan";

document.getElementById(
"harga"
).innerText =
"-";

document.getElementById(
"deskripsi"
).innerText =
"Data jasa tidak tersedia";

}

}

loadDetail();

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const auth = getAuth(app);

let isLoggedIn = false;

onAuthStateChanged(
auth,
(user)=>{

isLoggedIn = !!user;

}
);

document
.getElementById("btnPesan")
.addEventListener("click",()=>{

const user =
auth.currentUser;

if(!user){

alert(
"Silakan login terlebih dahulu"
);

window.location.href =
"index.html";

return;

}

if(
user.uid ===
serviceOwnerId
){

alert(
"Anda tidak dapat memesan jasa milik sendiri"
);

return;

}

window.location.href =
"booking.html?id=" +
serviceId;

});

</script>
